       <h3 style=\"margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid var(--pf-line);font:500 13px/1 var(--font-heading);letter-spacing:.02em;color:var(--color-text)\">Cloud &amp; DevOps<\u002Fh3>\n        <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n          <span style=\"padding:6px 11px;border-radius:6px;background:var(--pf-chip);font:400 12px/1 var(--pf-mono);color:var(--pf-muted)\">AWS<\u002Fspan>\n          <span style=\"padding:6px 11px;border-radius:6px;background:var(--pf-chip);font:400 12px/1 var(--pf-mono);color:var(--pf-muted)\">Google Cloud<\u002Fspan>\n          <span style=\"padding:6px 11px;border-radius:6px;background:var(--pf-chip);font:400 12px/1 var(--pf-mono);color:var(--pf-muted)\">Azure<\u002Fspan>\n          <span style=\"padding:6px 11px;border-radius:6px;background:var(--pf-chip);font:400 12px/1 var(--pf-mono);color:var(--pf-muted)\">Docker<\u002Fspan>\n          <span style=\"padding:6px 11px;border-radius:6px;background:var(--pf-chip);font:400 12px/1 var(--pf-mono);color:var(--pf-muted)\">Kubernetes<\u002Fspan>\n          <span style=\"padding:6px 11px;border-radius:6px;background:var(--pf-chip);font:400 12px/1 var(--pf-mono);color:var(--pf-muted)\">CI/CD<\u002Fspan>\n          <span style=\"padding:6px 11px;border-radius:6px;background:var(--pf-chip);font:400 12px/1 var(--pf-mono);color:var(--pf-muted)\">Self-hosted<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-reveal=\"\">\n        <h3 style=\"margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid var(--pf-line);font:500 13px/1 var(--font-heading);letter-spacing:.02em;color:var(--color-text)\"><span data-l=\"pt\">Dados<\u002Fspan><span data-l=\"en\">Data<\u002Fspan><\u002Fh3>\n        <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n          <span style=\"padding:6px 11px;border-radius:6px;background:var(--pf-chip);font:400 12px/1 var(--pf-mono);color:var(--pf-muted)\">PostgreSQL<\u002Fspan>\n          <span style=\"padding:6px 11px;border-radius:6px;background:var(--pf-chip);font:400 12px/1 var(--pf-mono);color:var(--pf-muted)\">MySQL<\u002Fspan>\n          <span style=\"padding:6px 11px;border-radius:6px;background:var(--pf-chip);font:400 12px/1 var(--pf-mono);color:var(--pf-muted)\">MongoDB<\u002Fspan>\n          <span style=\"padding:6px 11px;border-radius:6px;background:var(--pf-chip);font:400 12px/1 var(--pf-mono);color:var(--pf-muted)\">Redis<\u002Fspan>\n          <span style=\"padding:6px 11px;border-radius:6px;background:var(--pf-chip);font:400 12px/1 var(--pf-mono);color:var(--pf-muted)\">Firebase<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-reveal=\"\">\n        <h3 style=\"margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid var(--pf-line);font:500 13px/1 var(--font-heading);letter-spacing:.02em;color:var(--color-text)\"><span data-l=\"pt\">Mobile, testes &amp; práticas<\u002Fspan><span data-l=\"en\">Mobile, testing &amp; practices<\u002Fspan><\u002Fh3>\n        <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n          <span style=\"padding:6px 11px;border-radius:6px;background:var(--pf-chip);font:400 12px/1 var(--pf-mono);color:var(--pf-muted)\">Ionic<\u002Fspan>\n          <span style=\"padding:6px 11px;border-radius:6px;background:var(--pf-chip);font:400 12px/1 var(--pf-mono);color:var(--pf-muted)\">React Native<\u002Fspan>\n          <span style=\"padding:6px 11px;border-radius:6px;background:var(--pf-chip);font:400 12px/1 var(--pf-mono);color:var(--pf-muted)\">Cypress<\u002Fspan>\n          <span style=\"padding:6px 11px;border-radius:6px;background:var(--pf-chip);font:400 12px/1 var(--pf-mono);color:var(--pf-muted)\">PHPUnit<\u002Fspan>\n          <span style=\"padding:6px 11px;border-radius:6px;background:var(--pf-chip);font:400 12px/1 var(--pf-mono);color:var(--pf-muted)\">Minitest<\u002Fspan>\n          <span style=\"padding:6px 11px;border-radius:6px;background:var(--pf-chip);font:400 12px/1 var(--pf-mono);color:var(--pf-muted)\">Scrum<\u002Fspan>\n          <span style=\"padding:6px 11px;border-radius:6px;background:var(--pf-chip);font:400 12px/1 var(--pf-mono);color:var(--pf-muted)\">Kanban<\u002Fspan>\n          <span style=\"padding:6px 11px;border-radius:6px;background:var(--pf-chip);font:400 12px/1 var(--pf-mono);color:var(--pf-muted)\">Web security<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"sobre\" style=\"max-width:1160px;margin:0 auto;padding:clamp(56px,7vw,96px) 24px\">\n    <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(28px,5vw,64px);align-items:start\">\n      <div>\n        <div style=\"font:500 11px/1 var(--pf-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--color-accent);margin-bottom:14px\">04 — <span data-l=\"pt\">Sobre<\u002Fspan><span data-l=\"en\">About<\u002Fspan><\u002Fdiv>\n        <h2 style=\"margin:0 0 22px;font:500 clamp(28px,3.6vw,46px)/1.06 var(--font-heading);letter-spacing:-0.03em;color:var(--color-text)\"><span data-l=\"pt\">Como eu cheguei aqui<\u002Fspan><span data-l=\"en\">How I got here<\u002Fspan><\u002Fh2>\n        <p data-l=\"pt\" style=\"margin:0 0 16px;font-size:15px;line-height:1.75;color:var(--pf-muted);text-wrap:pretty\">Comecei cedo: entrei no técnico em informática do IFSC junto com o ensino médio, em 2014, e desde então nunca parei de escrever código. Depois veio Ciência da Computação na UFFS e, em 2019, a Pandev Tech — que nasceu de freelas e virou uma empresa com time e clientes de vários setores.<\u002Fp>\n        <p data-l=\"pt\" style=\"margin:0 0 16px;font-size:15px;line-height:1.75;color:var(--pf-muted);text-wrap:pretty\">O que me define profissionalmente é ser dono do problema inteiro. Já fiz o discovery com o cliente, desenhei a arquitetura, escrevi o backend, montei o frontend, subi em produção e atendi o chamado de sábado à noite. Isso muda a forma como eu tomo decisão técnica: eu sei o custo de cada atalho.<\u002Fp>\n        <p data-l=\"pt\" style=\"margin:0;font-size:15px;line-height:1.75;color:var(--pf-muted);text-wrap:pretty\">Hoje meu foco é IA aplicada a produto — estou na pós de Inteligência Artificial e Machine Learning na PUC Minas e coloco LLMs dentro de produtos comerciais que já rodam em produção. Trabalho remoto, em inglês, com times distribuídos.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <p data-l=\"en\" style=\"margin:0 0 16px;font-size:15px;line-height:1.75;color:var(--pf-muted);text-wrap:pretty\">I started early: I joined IFSC's technical IT program alongside high school back in 2014 and never stopped writing code. Then came Computer Science at UFFS and, in 2019, Pandev Tech — which grew out of freelance work into a company with a team and clients across several industries.<\u002Fp>\n        <p data-l=\"en\" style=\"margin:0 0 16px;font-size:15px;line-height:1.75;color:var(--pf-muted);text-wrap:pretty\">What defines me professionally is owning the whole problem. I've run discovery with the client, designed the architecture, written the backend, built the frontend, shipped it to production and answered the Saturday-night call. That changes how I make technical decisions: I know what every shortcut costs.<\u002Fp>\n        <p data-l=\"en\" style=\"margin:0 0 26px;font-size:15px;line-height:1.75;color:var(--pf-muted);text-wrap:pretty\">My focus now is AI applied to product — I'm doing a postgraduate degree in Artificial Intelligence and Machine Learning at PUC Minas and shipping LLMs inside commercial products already in production. I work remotely, in English, with distributed teams.<\u002Fp>\n        <div data-l=\"pt\" style=\"padding:22px;border-radius:14px;background:var(--color-surface);box-shadow:var(--shadow-sm)\">\n          <div style=\"font:500 10.5px/1 var(--pf-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent);margin-bottom:12px\">Fora do editor<\u002Fdiv>\n          <p style=\"margin:0;font-size:14px;line-height:1.7;color:var(--pf-muted);text-wrap:pretty\">Resolvo problemas no beecrowd, LeetCode e HackerRank quando quero desligar do trabalho e ainda pensar em código. Estudo japonês há um ano — pela mesma razão que gosto de sistemas legados: a gramática é um quebra-cabeça.<\u002Fp>\n        <\u002Fdiv>\n        <div data-l=\"en\" style=\"padding:22px;border-radius:14px;background:var(--color-surface);box-shadow:var(--shadow-sm)\">\n          <div style=\"font:500 10.5px/1 var(--pf-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent);margin-bottom:12px\">Outside the editor<\u002Fdiv>\n          <p style=\"margin:0;font-size:14px;line-height:1.7;color:var(--pf-muted);text-wrap:pretty\">I solve problems on beecrowd, LeetCode and HackerRank when I want to switch off from work and still think in code. I've been studying Japanese for a year — for the same reason I enjoy legacy systems: the grammar is a puzzle.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"formacao\" style=\"max-width:1160px;margin:0 auto;padding:clamp(56px,7vw,96px) 24px\">\n    <div data-reveal=\"\" style=\"margin-bottom:clamp(28px,4vw,48px)\">\n      <div style=\"font:500 11px/1 var(--pf-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--color-accent);margin-bottom:14px\">05 — <span data-l=\"pt\">Formação<\u002Fspan><span data-l=\"en\">Education<\u002Fspan><\u002Fdiv>\n      <h2 style=\"margin:0;font:500 clamp(28px,3.6vw,46px)/1.06 var(--font-heading);letter-spacing:-0.03em;color:var(--color-text)\"><span data-l=\"pt\">Formação, certificações e idiomas<\u002Fspan><span data-l=\"en\">Education, certifications and languages<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:clamp(24px,3vw,40px)\">\n\n      <div data-reveal=\"\">\n        <h3 style=\"margin:0 0 18px;padding-bottom:12px;border-bottom:1px solid var(--pf-line);font:500 13px/1 var(--font-heading);color:var(--color-text)\"><span data-l=\"pt\">Formação<\u002Fspan><span data-l=\"en\">Education<\u002Fspan><\u002Fh3>\n        <div style=\"display:flex;flex-direction:column;gap:20px\">\n          <div>\n            <div style=\"font-size:14.5px;font-weight:500;color:var(--color-text);line-height:1.4\"><span data-l=\"pt\">Pós-graduação em Inteligência Artificial e Machine Learning<\u002Fspan><span data-l=\"en\">Postgraduate — Artificial Intelligence and Machine Learning<\u002Fspan><\u002Fdiv>\n            <div style=\"margin-top:5px;font:400 12px/1.5 var(--pf-mono);color:var(--pf-muted)\">PUC Minas · 2025 — <span data-l=\"pt\">em andamento<\u002Fspan><span data-l=\"en\">in progress<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:14.5px;font-weight:500;color:var(--color-text);line-height:1.4\"><span data-l=\"pt\">Bacharelado em Ciência da Computação<\u002Fspan><span data-l=\"en\">B.Sc. in Computer Science<\u002Fspan><\u002Fdiv>\n            <div style=\"margin-top:5px;font:400 12px/1.5 var(--pf-mono);color:var(--pf-muted)\">UFFS · 2019 — 2024<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:14.5px;font-weight:500;color:var(--color-text);line-height:1.4\"><span data-l=\"pt\">Técnico em Informática (integrado ao ensino médio)<\u002Fspan><span data-l=\"en\">Technical Degree in IT (integrated with high school)<\u002Fspan><\u002Fdiv>\n            <div style=\"margin-top:5px;font:400 12px/1.5 var(--pf-mono);color:var(--pf-muted)\">IFSC · 2014 — 2018<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-reveal=\"\">\n        <h3 style=\"margin:0 0 18px;padding-bottom:12px;border-bottom:1px solid var(--pf-line);font:500 13px/1 var(--font-heading);color:var(--color-text)\"><span data-l=\"pt\">Certificações<\u002Fspan><span data-l=\"en\">Certifications<\u002Fspan><\u002Fh3>\n        <div style=\"display:flex;flex-direction:column;gap:20px\">\n          <div>\n            <div style=\"font-size:14.5px;font-weight:500;color:var(--color-text);line-height:1.4\">Google Data Analytics Certificate<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:14.5px;font-weight:500;color:var(--color-text);line-height:1.4\">TOEFL ITP<\u002Fdiv>\n            <div style=\"margin-top:5px;font:400 12px/1.5 var(--pf-mono);color:var(--pf-muted)\"><span data-l=\"pt\">Proficiência em inglês<\u002Fspan><span data-l=\"en\">English proficiency<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-reveal=\"\">\n        <h3 style=\"margin:0 0 18px;padding-bottom:12px;border-bottom:1px solid var(--pf-line);font:500 13px/1 var(--font-heading);color:var(--color-text)\"><span data-l=\"pt\">Idiomas<\u002Fspan><span data-l=\"en\">Languages<\u002Fspan><\u002Fh3>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"display:flex;justify-content:space-between;gap:12px;align-items:baseline\">\n            <span style=\"font-size:14.5px;color:var(--color-text)\"><span data-l=\"pt\">Português<\u002Fspan><span data-l=\"en\">Portuguese<\u002Fspan><\u002Fspan>\n            <span style=\"font:400 12px/1 var(--pf-mono);color:var(--pf-muted)\"><span data-l=\"pt\">Nativo<\u002Fspan><span data-l=\"en\">Native<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:12px;align-items:baseline\">\n            <span style=\"font-size:14.5px;color:var(--color-text)\"><span data-l=\"pt\">Inglês<\u002Fspan><span data-l=\"en\">English<\u002Fspan><\u002Fspan>\n            <span style=\"font:400 12px/1 var(--pf-mono);color:var(--pf-muted)\"><span data-l=\"pt\">Proficiente · 8 anos<\u002Fspan><span data-l=\"en\">Proficient · 8 years<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:12px;align-items:baseline\">\n            <span style=\"font-size:14.5px;color:var(--color-text)\"><span data-l=\"pt\">Espanhol<\u002Fspan><span data-l=\"en\">Spanish<\u002Fspan><\u002Fspan>\n            <span style=\"font:400 12px/1 var(--pf-mono);color:var(--pf-muted)\"><span data-l=\"pt\">Intermediário · 2 anos<\u002Fspan><span data-l=\"en\">Intermediate · 2 years<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:12px;align-items:baseline\">\n            <span style=\"font-size:14.5px;color:var(--color-text)\"><span data-l=\"pt\">Japonês<\u002Fspan><span data-l=\"en\">Japanese<\u002Fspan><\u002Fspan>\n            <span style=\"font:400 12px/1 var(--pf-mono);color:var(--pf-muted)\"><span data-l=\"pt\">Básico · 1 ano<\u002Fspan><span data-l=\"en\">Beginner · 1 year<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"border-top:1px solid var(--pf-line);margin-top:clamp(32px,5vw,64px)\">\n    <div style=\"max-width:1160px;margin:0 auto;padding:clamp(48px,6vw,80px) 24px\">\n      <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:clamp(28px,4vw,56px);align-items:start\">\n        <div>\n          <h2 style=\"margin:0 0 14px;font:500 clamp(26px,3.2vw,40px)/1.1 var(--font-heading);letter-spacing:-0.03em;color:var(--color-text)\"><span data-l=\"pt\">Vamos conversar<\u002Fspan><span data-l=\"en\">Let's talk<\u002Fspan><\u002Fh2>\n          <p data-l=\"pt\" style=\"margin:0 0 22px;font-size:15px;line-height:1.7;color:var(--pf-muted);max-width:44ch;text-wrap:pretty\">Aberto a posições remotas internacionais e a projetos pela Pandev. Respondo em português ou inglês.<\u002Fp>\n          <p data-l=\"en\" style=\"margin:0 0 22px;font-size:15px;line-height:1.7;color:var(--pf-muted);max-width:44ch;text-wrap:pretty\">Open to remote international roles and to project work through Pandev. Happy to talk in English or Portuguese.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n            <a href=\"mailto:leo.comikevizk@gmail.com\" style=\"border:1px solid var(--color-accent);border-radius:8px;padding:11px 18px;font-size:13.5px;font-weight:500;color:var(--color-accent);transition:background .2s ease\" style-hover=\"background:color-mix(in srgb,var(--color-accent) 14%,transparent)\">leo.comikevizk@gmail.com<\u002Fa>\n            <a href=\"assets/Leonardo_Rebonatto_CV_EN_2026.pdf\" download=\"Leonardo_Rebonatto_CV.pdf\" style=\"border:1px solid var(--pf-line);border-radius:8px;padding:11px 18px;font-size:13.5px;font-weight:500;color:var(--pf-muted);transition:color .2s ease,border-color .2s ease\" style-hover=\"color:var(--color-text);border-color:var(--pf-muted)\"><span data-l=\"pt\">Baixar CV (PDF)<\u002Fspan><span data-l=\"en\">Download CV (PDF)<\u002Fspan><\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:24px\">\n          <div>\n            <div style=\"font:500 10.5px/1 var(--pf-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--pf-muted);margin-bottom:14px\">Links<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:9px;font-size:13.5px\">\n              <a href=\"https://www.linkedin.com/in/leonardo-rebonatto/\" target=\"_blank\" rel=\"noopener\">LinkedIn<\u002Fa>\n              <a href=\"https://github.com/LRebonatto\" target=\"_blank\" rel=\"noopener\">GitHub<\u002Fa>\n              <a href=\"https://pandev.com.br\" target=\"_blank\" rel=\"noopener\">Pandev Tech<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font:500 10.5px/1 var(--pf-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--pf-muted);margin-bottom:14px\">Code<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:9px;font-size:13.5px\">\n              <a href=\"https://leetcode.com/Rebonatto\" target=\"_blank\" rel=\"noopener\">LeetCode<\u002Fa>\n              <a href=\"https://www.hackerrank.com/profile/leo_comikevizk\" target=\"_blank\" rel=\"noopener\">HackerRank<\u002Fa>\n              <a href=\"https://www.beecrowd.com.br/judge/pt/profile/328964\" target=\"_blank\" rel=\"noopener\">beecrowd<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font:500 10.5px/1 var(--pf-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--pf-muted);margin-bottom:14px\"><span data-l=\"pt\">Contato<\u002Fspan><span data-l=\"en\">Contact<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:9px;font-size:13.5px\">\n              <a href=\"tel:+5549989181764\">+55 49 98918-1764<\u002Fa>\n              <span style=\"color:var(--pf-muted)\">Chapecó, SC<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:clamp(36px,5vw,64px);padding-top:22px;border-top:1px solid var(--pf-line);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center\">\n        <span style=\"font:400 11.5px/1.5 var(--pf-mono);color:var(--pf-muted)\">© 2026 Leonardo Rebonatto<\u002Fspan>\n        <span style=\"font:400 11.5px/1.5 var(--pf-mono);color:var(--pf-muted)\"><span data-l=\"pt\">↑↑↓↓←→←→ba<\u002Fspan><span data-l=\"en\">↑↑↓↓←→←→ba<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  <sc-if value=\"{{ egg }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:80;padding:13px 22px;border-radius:999px;background:var(--color-accent);color:#161826;font:500 13px/1 var(--pf-mono);box-shadow:var(--shadow-lg)\">{{ eggText }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#9184d9&quot;,&quot;options&quot;:[&quot;#9184d9&quot;,&quot;#7fb6a1&quot;,&quot;#d99a84&quot;,&quot;#84a9d9&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Aparência&quot;},&quot;enableCanvas&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Aparência&quot;},&quot;showTerminal&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Conteúdo&quot;}}\">\nclass Component extends DCLogic {\n  state = { lines: [], egg: false, eggText: '' };\n\n  lang() { return document.documentElement.dataset.lang === 'en' ? 'en' : 'pt'; }\n\n  t(pt, en) { return this.lang() === 'en' ? en : pt; }\n\n  boot() {\n    const l = this.lang();\n    return [\n      { t: l === 'en' ? 'leo.sh — portfolio shell v2.6' : 'leo.sh — shell do portfólio v2.6', c: 'var(--pf-muted)' },\n      { t: l === 'en' ? 'Type \"help\" to see what this thing does.' : 'Digite \"help\" para ver o que dá pra fazer aqui.', c: 'var(--pf-muted)' },\n      { t: '', c: 'var(--pf-muted)' }\n    ];\n  }\n\n  componentDidMount() {\n    this.setState({ lines: this.boot() });\n    this.applyAccent();\n    this.fixAssets();\n    this.initReveal();\n    this.initCanvas();\n    this.initCursor();\n    this.initKeys();\n    this.initResponsive();\n    try {\n      console.log('%cLeonardo Rebonatto', 'color:#9184d9;font:500 22px Inter,sans-serif');\n      console.log('%cLooking under the hood? Good instinct. leo.comikevizk@gmail.com', 'color:#9397ab;font:13px monospace');\n    } catch (e) {}\n  }\n\n  componentDidUpdate(prev) {\n    if (prev.accent !== this.props.accent) this.applyAccent();\n  }\n\n  componentWillUnmount() {\n    this.dead = true;\n    if (this.raf) cancelAnimationFrame(this.raf);\n    if (this.io) this.io.disconnect();\n    if (this.ro) this.ro.disconnect();\n    if (this.rootRo) this.rootRo.disconnect();\n    window.removeEventListener('keydown', this.onKey);\n    window.removeEventListener('pointermove', this.onMove);\n    window.removeEventListener('resize', this.onResize);\n  }\n\n  fixAssets() {\n    const r = window.__resources;\n    if (!r || !this.root) return;\n    if (r.cvPdf) this.root.querySelectorAll('a[href$=\"CV_EN_2026.pdf\"]').forEach(a => { a.href = r.cvPdf; });\n    if (r.leoPhoto) this.root.querySelectorAll('img[src$=\"leo.png\"]').forEach(i => { i.src = r.leoPhoto; });\n    if (r.pandevLogo) this.root.querySelectorAll('img[src$=\"pandev.svg\"]').forEach(i => { i.src = r.pandevLogo; });\n  }\n\n  applyAccent() {\n    const a = this.props.accent;\n    if (a) document.documentElement.style.setProperty('--color-accent', a);\n  }\n\n  /* ---------- responsive bits the stylesheet can't express inline ---------- */\n  initResponsive() {\n    this.onResize = () => {\n      const r = this.root; if (!r) return;\n      const w = r.clientWidth || window.innerWidth;\n      if (!w) return;\n      const nav = r.querySelector('[data-navlinks]');\n      if (nav) nav.style.display = w >= 900 ? 'flex' : 'none';\n      const hero = r.querySelector('[data-hero]');\n      if (hero) hero.style.gridTemplateColumns = w >= 900 ? 'minmax(0,1.35fr) minmax(0,1fr)' : 'minmax(0,1fr)';\n      const brand = r.querySelector('[data-brandname]');\n      if (brand) brand.style.display = w >= 420 ? 'inline' : 'none';\n      const navcv = r.querySelector('[data-navcv]');\n      if (navcv) navcv.style.display = w >= 620 ? 'inline-block' : 'none';\n      r.querySelectorAll('[data-row]').forEach(el => {\n        el.style.gridTemplateColumns = w >= 720 ? 'minmax(0,168px) minmax(0,1fr)' : 'minmax(0,1fr)';\n      });\n    };\n    requestAnimationFrame(this.onResize);\n    window.addEventListener('resize', this.onResize);\n    if (this.root && 'ResizeObserver' in window) {\n      this.rootRo = new ResizeObserver(this.onResize);\n      this.rootRo.observe(this.root);\n    }\n  }\n\n  /* ---------- scroll reveal ---------- */\n  initReveal() {\n    const r = this.root; if (!r) return;\n    const els = r.querySelectorAll('[data-reveal]');\n    if (!('IntersectionObserver' in window)) {\n      els.forEach(el => { el.dataset.reveal = 'in'; });\n      return;\n    }\n    this.io = new IntersectionObserver((entries) => {\n      entries.forEach(e => {\n        if (e.isIntersecting) { e.target.dataset.reveal = 'in'; this.io.unobserve(e.target); }\n      });\n    }, { rootMargin: '0px 0px -6% 0px', threshold: 0.06 });\n    els.forEach((el, i) => { el.style.transitionDelay = (Math.min(i, 4) * 55) + 'ms'; this.io.observe(el); });\n    setTimeout(() => { els.forEach(el => { el.dataset.reveal = 'in'; }); }, 4000);\n  }\n\n  /* ---------- hero canvas field ---------- */\n  hexToRgb(h) {\n    h = (h || '').trim().replace('#', '');\n    if (h.length === 3) h = h.split('').map(c => c + c).join('');\n    const n = parseInt(h || '9184d9', 16);\n    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];\n  }\n\n  initCanvas() {\n    const c = this.canvas;\n    if (!c || this.props.enableCanvas === false) return;\n    const ctx = c.getContext('2d');\n    if (!ctx) return;\n    let w = 0, h = 0, pts = [], t = 0;\n    const mouse = { x: -9999, y: -9999, tx: -9999, ty: -9999 };\n    const gap = 32;\n\n    const build = () => {\n      pts = [];\n      for (let y = gap / 2; y < h; y += gap)\n        for (let x = gap / 2; x < w; x += gap)\n          pts.push({ x, y, p: Math.random() * Math.PI * 2 });\n    };\n    const resize = () => {\n      const dpr = Math.min(2, window.devicePixelRatio || 1);\n      w = c.clientWidth; h = c.clientHeight;\n      c.width = Math.max(1, w * dpr); c.height = Math.max(1, h * dpr);\n      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n      build();\n    };\n\n    this.ro = new ResizeObserver(resize);\n    this.ro.observe(c);\n    resize();\n\n    this.onMove = (e) => {\n      const r = c.getBounding
