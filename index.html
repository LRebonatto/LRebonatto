  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        let bytes;
        if (entry.path) {
          const response = await fetch(entry.path);
          if (!response.ok) throw new Error('Failed to fetch asset path ' + entry.path);
          bytes = new Uint8Array(await response.arrayBuffer());
        } else if (entry.data) {
          const binaryStr = atob(entry.data);
          bytes = new Uint8Array(binaryStr.length);
          for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);
        } else {
          throw new Error('Asset has no data or path');
        }

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"6c7144d9-27cb-4b93-bce4-033c9c1172e6\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #161826;\n  --color-surface: #232532;\n  --color-text: #e9e9ed;\n  --color-accent: #9184d9; /* review round 7 (Barron): the accent moves to\n     the product's blurple — OKLCH hue 289.2, the hue of the app's own Pro\n     accent (#9a8fe0, --om-accent-pro) — at the same lightness the steel\n     accent held (L 0.660, so the documented ratios survive) and chroma\n     in the product blurple's own range (its token sits at C 0.118; the\n     accent takes 0.125, from the old steel's 0.030):\n     the accent now reads as an accent rather than another neutral. */\n  --color-accent-2: #a7a1db; /* the machine-derived stand-in follows: same\n     hue, same L 0.734, chroma at the same 2:3 proportion it held */\n  --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f3f5fe;\n  --color-neutral-200: #e4e7f5;\n  --color-neutral-300: #cfd3e5;\n  --color-neutral-400: #b2b6ca;\n  --color-neutral-500: #9397ab;\n  --color-neutral-600: #75798c;\n  --color-neutral-700: #595d6c;\n  --color-neutral-800: #3f424d;\n  --color-neutral-900: #292b31;\n\n  --color-accent-100: #f5f4ff;\n  --color-accent-200: #e7e5fe;\n  --color-accent-300: #d2cefd;\n  --color-accent-400: #b5abfc;\n  --color-accent-500: #968ae0;\n  --color-accent-600: #796cbf;\n  --color-accent-700: #5d5294;\n  --color-accent-800: #423a6a;\n  --color-accent-900: #2b2741;\n\n  --color-accent-2-100: #f5f4ff;\n  --color-accent-2-200: #e7e5fe;\n  --color-accent-2-300: #d2cefd;\n  --color-accent-2-400: #b5afe8;\n  --color-accent-2-500: #9690c9;\n  --color-accent-2-600: #7972a9;\n  --color-accent-2-700: #5c5783;\n  --color-accent-2-800: #423e5d;\n  --color-accent-2-900: #2b293a;\n\n  /* Deck section-divider ground — review round 3: saturation as presence.\n     Dividers take a saturated deep indigo (hue 277, the neutral ramp's own\n     family; C 0.094 — written when the accent held C 0.030, before the\n     round-7 blurple raised it past the ground's) with a lighter bloom and\n     a ghost tint of the same hue, while the slide grounds stay\n     desaturated. Deck-scale fills only — not interface colors. */\n  --color-section: #262a60;\n  --color-section-glow: #353b80;\n  --color-section-ghost: #4c5397;\n\n  --font-heading: \"Inter\", system-ui, sans-serif;\n  --font-heading-weight: 500;\n  --font-body: \"Inter\", system-ui, sans-serif;\n\n  --space-1: 2.8px;\n  --space-2: 5.6px;\n  --space-3: 8.4px;\n  --space-4: 11.2px;\n  --space-6: 16.8px;\n  --space-8: 22.4px;\n\n  --radius-sm: 4px;\n  --radius-md: 8px;\n  --radius-lg: 14px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 0 0 1px #3f424d;\n  --shadow-md: 0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,0.55);\n  --shadow-lg: 0 0 0 1px #9397ab, 0 16px 40px rgba(0,0,0,0.65);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.lighten{mix-blend-mode:lighten;background-color:transparent}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n/* Rules fade to transparent at both ends instead of stopping cleanly — a\n   Nocturne signature. The ramp is 48px an end (one deck baseline unit),\n   painted from the same divider token. Freestanding rules fade; box\n   outlines, in-control separators, and short accent marks stay solid. */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: linear-gradient(to right,\n    transparent, var(--color-divider) 48px,\n    var(--color-divider) calc(100% - 48px), transparent);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }\n.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }\n.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-800); color: var(--color-accent-100); }\n.tag-accent-2 { background: var(--color-accent-2-800); color: var(--color-accent-2-100); }\n.tag-neutral { background: var(--color-neutral-800); color: var(--color-neutral-100); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid transparent; /* keeps layout; the row paints the fading rule */\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid transparent;\n}\n/* Row rules as row-level strips so the end-fade spans the row, not each cell. */\n.table thead tr {\n  background: linear-gradient(to right,\n    transparent, var(--color-divider) 48px,\n    var(--color-divider) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n.table tbody tr {\n  background: linear-gradient(to right,\n    transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,\n    color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n.table tbody tr:hover {\n  /* the hover tint layers over the row rule, which keeps painting */\n  background:\n    linear-gradient(color-mix(in srgb, var(--color-text) 4%, transparent),\n                    color-mix(in srgb, var(--color-text) 4%, transparent)) no-repeat 0 0 / 100% 100%,\n    linear-gradient(to right,\n      transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,\n      color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"f7f27d3e-9487-45c0-83e8-e8bd4855ea9b\"><\u002Fscript>\n<style>\n  *,*::before,*::after{box-sizing:border-box}\n  html{scroll-behavior:smooth}\n  body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}\n  :root{\n    --pf-muted:#b2b6ca;\n    --pf-line:color-mix(in srgb,#e9e9ed 12%,transparent);\n    --pf-chip:#232532;\n    --pf-mono:\"JetBrains Mono\",ui-monospace,SFMono-Regular,Menlo,monospace;\n    --pf-glow:color-mix(in srgb,var(--color-accent) 22%,transparent);\n  }\n  [data-theme=\"light\"]{\n    --color-bg:#f3f5fe;\n    --color-surface:#e9ebf7;\n    --color-text:#292b31;\n    --color-accent:#5d5294;\n    --color-divider:color-mix(in srgb,#292b31 16%,transparent);\n    --pf-muted:#595d6c;\n    --pf-line:color-mix(in srgb,#292b31 14%,transparent);\n    --pf-chip:#e4e7f5;\n    --shadow-sm:0 0 0 1px #cfd3e5;\n    --shadow-md:0 0 0 1px #b2b6ca, 0 6px 18px rgba(41,43,49,0.10);\n  }\n  a{color:var(--color-accent);text-decoration:none;transition:color .18s ease}\n  a:hover{color:var(--color-accent-400)}\n  [data-theme=\"light\"] a:hover{color:var(--color-accent-700)}\n  ::selection{background:color-mix(in srgb,var(--color-accent) 32%,transparent)}\n  :focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}\n  html[data-lang=\"pt\"] [data-l=\"en\"],html[data-lang=\"en\"] [data-l=\"pt\"]{display:none !important}\n  html[data-lang=\"pt\"] [data-langbtn=\"pt\"],html[data-lang=\"en\"] [data-langbtn=\"en\"]{color:var(--color-bg) !important;background:var(--color-accent) !important}\n  :root{--pf-accent-ink:var(--color-accent-300)}\n  [data-theme=\"light\"]{--pf-accent-ink:#463d78}\n  html[data-theme=\"light\"] [data-t=\"dark\"],html:not([data-theme=\"light\"]) [data-t=\"light\"]{display:none}\n  [data-reveal]{opacity:0;transform:translateY(16px);transition:opacity .7s cubic-bezier(.2,.7,.3,1),transform .7s cubic-bezier(.2,.7,.3,1)}\n  [data-reveal=\"in\"]{opacity:1;transform:none}\n  @keyframes pf-blink{0%,49%{opacity:1}50%,100%{opacity:0}}\n  @keyframes pf-drift{from{transform:translateY(0)}to{transform:translateY(-6px)}}\n  @media (prefers-reduced-motion:reduce){[data-reveal]{opacity:1;transform:none;transition:none}}\n<\u002Fstyle>\n<script>\n  (function(){\n    var d=document.documentElement;\n    var l=null;try{l=localStorage.getItem('lr-lang')}catch(e){}\n    if(l!=='pt'&&l!=='en'){l=(navigator.language||'pt').toLowerCase().indexOf('pt')===0?'pt':'en'}\n    d.dataset.lang=l;\n    var t=null;try{t=localStorage.getItem('lr-theme')}catch(e){}\n    if(t==='light'){d.dataset.theme='light'}\n  })();\n<\u002Fscript>\n<\u002Fhelmet>\n\n<div ref=\"{{ rootRef }}\" style=\"position:relative;min-height:100vh\">\n\n  <canvas ref=\"{{ canvasRef }}\" style=\"position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:-1\"><\u002Fcanvas>\n\n  <header style=\"position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--color-bg) 82%,transparent);border-bottom:1px solid var(--pf-line)\">\n    <nav style=\"max-width:1160px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:24px\">\n      <a href=\"#inicio\" style=\"display:flex;align-items:center;gap:10px;color:var(--color-text);font-weight:500;letter-spacing:-0.01em\">\n        <span style=\"display:grid;place-items:center;width:30px;height:30px;border:1px solid var(--color-accent);border-radius:8px;font:500 12px/1 var(--pf-mono);color:var(--color-accent)\">LR<\u002Fspan>\n        <span data-brandname=\"1\" style=\"font-size:14px;white-space:nowrap\">Leonardo Rebonatto<\u002Fspan>\n      <\u002Fa>\n      <div style=\"flex:1\"><\u002Fdiv>\n      <div style=\"display:none;gap:22px;align-items:center\" data-navlinks=\"1\">\n        <a href=\"#experiencia\" style=\"font-size:13px;color:var(--pf-muted)\"><span data-l=\"pt\">Experiência<\u002Fspan><span data-l=\"en\">Experience<\u002Fspan><\u002Fa>\n        <a href=\"#projetos\" style=\"font-size:13px;color:var(--pf-muted)\"><span data-l=\"pt\">Projetos<\u002Fspan><span data-l=\"en\">Work<\u002Fspan><\u002Fa>\n        <a href=\"#stack\" style=\"font-size:13px;color:var(--pf-muted)\">Stack<\u002Fa>\n        <a href=\"#sobre\" style=\"font-size:13px;color:var(--pf-muted)\"><span data-l=\"pt\">Sobre<\u002Fspan><span data-l=\"en\">About<\u002Fspan><\u002Fa>\n        <a href=\"#formacao\" style=\"font-size:13px;color:var(--pf-muted)\"><span data-l=\"pt\">Formação<\u002Fspan><span data-l=\"en\">Education<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px\">\n        <div style=\"display:flex;border:1px solid var(--pf-line);border-radius:999px;overflow:hidden\">\n          <button type=\"button\" data-langbtn=\"pt\" sc-camel-on-click=\"{{ setPt }}\" style=\"border:0;background:transparent;color:var(--pf-muted);font:500 11px/1 var(--pf-mono);letter-spacing:.06em;padding:7px 11px;cursor:pointer;transition:background .2s ease,color .2s ease\">PT<\u002Fbutton>\n          <button type=\"button\" data-langbtn=\"en\" sc-camel-on-click=\"{{ setEn }}\" style=\"border:0;background:transparent;color:var(--pf-muted);font:500 11px/1 var(--pf-mono);letter-spacing:.06em;padding:7px 11px;cursor:pointer;transition:background .2s ease,color .2s ease\">EN<\u002Fbutton>\n        <\u002Fdiv>\n        <button type=\"button\" sc-camel-on-click=\"{{ toggleTheme }}\" aria-label=\"theme\" style=\"width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--pf-line);border-radius:999px;background:transparent;color:var(--pf-muted);cursor:pointer;transition:color .2s ease,border-color .2s ease\" style-hover=\"color: var(--color-accent); border-color: var(--color-accent)\">\n          <span data-t=\"light\" style=\"font-size:13px\">☾<\u002Fspan>\n          <span data-t=\"dark\" style=\"font-size:13px\">☀<\u002Fspan>\n        <\u002Fbutton>\n        <a data-navcv=\"1\" href=\"assets/Leonardo_Rebonatto_CV_EN_2026.pdf\" download=\"Leonardo_Rebonatto_CV.pdf\" style=\"border:1px solid var(--color-accent);border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:500;color:var(--color-accent);white-space:nowrap;transition:background .2s ease\" style-hover=\"background:color-mix(in srgb,var(--color-accent) 14%,transparent)\">\n          <span data-l=\"pt\">Baixar CV<\u002Fspan><span data-l=\"en\">Download CV<\u002Fspan>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <section id=\"inicio\" style=\"position:relative\">\n    <div style=\"position:relative;max-width:1160px;margin:0 auto;padding:clamp(56px,9vw,120px) 24px clamp(48px,7vw,96px);display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(32px,5vw,72px);align-items:center\" data-hero=\"1\">\n      <div>\n        <div data-reveal=\"\" style=\"display:flex;align-items:center;gap:10px;margin-bottom:22px\">\n          <span style=\"width:7px;height:7px;border-radius:999px;background:var(--color-accent);box-shadow:0 0 0 4px var(--pf-glow)\"><\u002Fspan>\n          <span style=\"font:500 11px/1 var(--pf-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--pf-muted)\"><span data-l=\"pt\">Chapecó, SC · Remoto · Disponível<\u002Fspan><span data-l=\"en\">Chapecó, Brazil · Remote · Available<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <h1 data-reveal=\"\" style=\"margin:0 0 18px;font:500 clamp(38px,6.2vw,76px)/1.02 var(--font-heading);letter-spacing:-0.035em;color:var(--color-text);text-wrap:balance\">\n          <span data-l=\"pt\">Oi, eu sou o Léo.<\u002Fspan><span data-l=\"en\">Hi, I'm Léo.<\u002Fspan>\n        <\u002Fh1>\n        <p data-reveal=\"\" data-l=\"pt\" style=\"margin:0 0 18px;font-size:clamp(16px,1.6vw,19px);line-height:1.6;color:var(--color-text);max-width:56ch;text-wrap:pretty\">Desenvolvedor fullstack sênior — backend, LLMs e ferramentas de IA, cloud. Especialista em Angular (v20–22) e fundador da <a href=\"https://pandev.com.br\" target=\"_blank\" rel=\"noopener\">Pandev Tech<\u002Fa>.<\u002Fp>\n        <p data-reveal=\"\" data-l=\"en\" style=\"margin:0 0 18px;font-size:clamp(16px,1.6vw,19px);line-height:1.6;color:var(--color-text);max-width:56ch;text-wrap:pretty\">Senior fullstack developer — backend, LLMs and AI tooling, cloud. Angular specialist (v20–22) and founder of <a href=\"https://pandev.com.br\" target=\"_blank\" rel=\"noopener\">Pandev Tech<\u002Fa>.<\u002Fp>\n        <p data-reveal=\"\" data-l=\"pt\" style=\"margin:0 0 32px;font-size:15px;line-height:1.7;color:var(--pf-muted);max-width:58ch;text-wrap:pretty\">São 8+ anos construindo e escalando sistemas. Na Pandev eu faço a coisa inteira: da conversa com o cliente à arquitetura, ao código, ao deploy e ao suporte. Hoje coloco LLMs dentro de produtos web que rodam em produção — e uso IA no meu próprio fluxo de trabalho para entregar mais rápido sem abrir mão da qualidade.<\u002Fp>\n        <p data-reveal=\"\" data-l=\"en\" style=\"margin:0 0 32px;font-size:15px;line-height:1.7;color:var(--pf-muted);max-width:58ch;text-wrap:pretty\">8+ years building and scaling systems. At Pandev I own the whole thing: from the client conversation to architecture, code, deployment and support. These days I ship LLMs inside commercial web products — and use AI in my own workflow to deliver faster without trading away quality.<\u002Fp>\n        <div data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;gap:10px;margin-bottom:40px\">\n          <a href=\"mailto:leo.comikevizk@gmail.com\" style=\"border:1px solid var(--color-accent);border-radius:8px;padding:11px 18px;font-size:13.5px;font-weight:500;color:var(--color-accent);transition:background .2s ease\" style-hover=\"background:color-mix(in srgb,var(--color-accent) 14%,transparent)\"><span data-l=\"pt\">Falar comigo<\u002Fspan><span data-l=\"en\">Get in touch<\u002Fspan><\u002Fa>\n          <a href=\"https://www.linkedin.com/in/leonardo-rebonatto/\" target=\"_blank\" rel=\"noopener\" style=\"border:1px solid var(--pf-line);border-radius:8px;padding:11px 18px;font-size:13.5px;font-weight:500;color:var(--pf-muted);transition:color .2s ease,border-color .2s ease\" style-hover=\"color:var(--color-text);border-color:var(--pf-muted)\">LinkedIn<\u002Fa>\n          <a href=\"https://github.com/LRebonatto\" target=\"_blank\" rel=\"noopener\" style=\"border:1px solid var(--pf-line);border-radius:8px;padding:11px 18px;font-size:13.5px;font-weight:500;color:var(--pf-muted);transition:color .2s ease,border-color .2s ease\" style-hover=\"color:var(--color-text);border-color:var(--pf-muted)\">GitHub<\u002Fa>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;max-width:520px;padding-top:26px;border-top:1px solid var(--pf-line)\">\n          <div>\n            <div style=\"font:500 clamp(24px,3vw,32px)/1 var(--font-heading);color:var(--color-text);letter-spacing:-0.02em\">8+<\u002Fdiv>\n            <div style=\"margin-top:7px;font-size:12px;line-height:1.4;color:var(--pf-muted)\"><span data-l=\"pt\">anos de experiência<\u002Fspan><span data-l=\"en\">years of experience<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font:500 clamp(24px,3vw,32px)/1 var(--font-heading);color:var(--color-text);letter-spacing:-0.02em\">5+<\u002Fdiv>\n            <div style=\"margin-top:7px;font-size:12px;line-height:1.4;color:var(--pf-muted)\"><span data-l=\"pt\">apps grandes em produção<\u002Fspan><span data-l=\"en\">large apps in production<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font:500 clamp(24px,3vw,32px)/1 var(--font-heading);color:var(--color-text);letter-spacing:-0.02em\">4<\u002Fdiv>\n            <div style=\"margin-top:7px;font-size:12px;line-height:1.4;color:var(--pf-muted)\"><span data-l=\"pt\">idiomas<\u002Fspan><span data-l=\"en\">languages<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"position:relative\">\n        <div style=\"position:relative;border-radius:14px;overflow:hidden;box-shadow:var(--shadow-md);aspect-ratio:4/5;background:var(--color-surface)\">\n          <img src=\"8eb708b1-78bd-4c2f-8e1f-98750477cef4\" alt=\"Leonardo Rebonatto\" style=\"width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block;filter:saturate(.92) contrast(1.03)\">\n          <div style=\"position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,color-mix(in srgb,var(--color-bg) 88%,transparent) 100%)\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position:absolute;left:-14px;bottom:-16px;display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:999px;background:var(--color-surface);box-shadow:var(--shadow-md)\">\n          <img src=\"ced57e4b-0f21-43ef-83ab-c6c30854fc10\" alt=\"Pandev Tech\" style=\"height:16px;width:auto;display:block\">\n          <span style=\"font:500 11px/1 var(--pf-mono);letter-spacing:.08em;color:var(--pf-muted)\">FOUNDER &amp; CTO<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ showTerminal }}\" hint-placeholder-val=\"{{ true }}\">\n  <section style=\"max-width:1160px;margin:0 auto;padding:clamp(24px,4vw,48px) 24px clamp(56px,7vw,88px)\">\n    <div data-reveal=\"\" sc-camel-on-click=\"{{ focusTerm }}\" style=\"border-radius:14px;overflow:hidden;box-shadow:var(--shadow-md);background:var(--color-surface);cursor:text\">\n      <div style=\"display:flex;align-items:center;gap:8px;padding:11px 15px;border-bottom:1px solid var(--pf-line)\">\n        <span style=\"width:9px;height:9px;border-radius:999px;background:var(--pf-muted);opacity:.45\"><\u002Fspan>\n        <span style=\"width:9px;height:9px;border-radius:999px;background:var(--pf-muted);opacity:.45\"><\u002Fspan>\n        <span style=\"width:9px;height:9px;border-radius:999px;background:var(--color-accent)\"><\u002Fspan>\n        <span style=\"margin-left:8px;font:400 11.5px/1 var(--pf-mono);color:var(--pf-muted)\">leo@pandev — zsh<\u002Fspan>\n        <span style=\"flex:1\"><\u002Fspan>\n        <span style=\"font:400 11px/1 var(--pf-mono);color:var(--pf-muted)\"><span data-l=\"pt\">digite “help”<\u002Fspan><span data-l=\"en\">type “help”<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div ref=\"{{ termScrollRef }}\" style=\"padding:18px 18px 6px;max-height:340px;overflow-y:auto;font:400 13px/1.75 var(--pf-mono)\">\n        <sc-for list=\"{{ lines }}\" as=\"line\" hint-placeholder-count=\"5\">\n          <div style=\"white-space:pre-wrap;word-break:break-word;color:{{ line.c }}\">{{ line.t }}<\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"display:flex;align-items:center;gap:9px;padding:6px 0 16px\">\n          <span style=\"color:var(--color-accent);flex:none\">❯<\u002Fspan>\n          <input ref=\"{{ termInputRef }}\" sc-camel-on-key-down=\"{{ onTermKey }}\" spellcheck=\"false\" autocomplete=\"off\" aria-label=\"terminal\" style=\"flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--color-text);font:400 13px/1.75 var(--pf-mono);padding:0\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <section id=\"experiencia\" style=\"max-width:1160px;margin:0 auto;padding:clamp(56px,7vw,96px) 24px\">\n    <div data-reveal=\"\" style=\"margin-bottom:clamp(32px,4vw,56px)\">\n      <div style=\"font:500 11px/1 var(--pf-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--color-accent);margin-bottom:14px\">01 — <span data-l=\"pt\">Trajetória<\u002Fspan><span data-l=\"en\">Track record<\u002Fspan><\u002Fdiv>\n      <h2 style=\"margin:0 0 14px;font:500 clamp(28px,3.6vw,46px)/1.06 var(--font-heading);letter-spacing:-0.03em;color:var(--color-text)\"><span data-l=\"pt\">Onde eu construí coisas<\u002Fspan><span data-l=\"en\">Where I've built things<\u002Fspan><\u002Fh2>\n      <p data-l=\"pt\" style=\"margin:0;font-size:15px;line-height:1.7;color:var(--pf-muted);max-width:60ch;text-wrap:pretty\">Sete posições em oito anos, quase todas remotas e várias em paralelo com a Pandev. O fio comum é o mesmo: sistemas que precisam aguentar carga real e times que precisam de alguém que resolve de ponta a ponta.<\u002Fp>\n      <p data-l=\"en\" style=\"margin:0;font-size:15px;line-height:1.7;color:var(--pf-muted);max-width:60ch;text-wrap:pretty\">Seven roles in eight years, nearly all remote and several running alongside Pandev. The thread is the same: systems that have to hold real load, and teams that need someone who takes it end to end.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:2px\">\n\n      <div data-reveal=\"\" style=\"display:grid;grid-template-columns:minmax(0,168px) minmax(0,1fr);gap:clamp(16px,3vw,44px);padding:26px 0;border-top:1px solid var(--pf-line)\" data-row=\"1\">\n        <div>\n          <div style=\"font:500 11.5px/1.5 var(--pf-mono);letter-spacing:.04em;color:var(--color-accent)\">2025 — <span data-l=\"pt\">hoje<\u002Fspan><span data-l=\"en\">now<\u002Fspan><\u002Fdiv>\n          <div style=\"margin-top:6px;font-size:11.5px;color:var(--pf-muted)\">Remote<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <h3 style=\"margin:0 0 3px;font:500 19px/1.3 var(--font-heading);color:var(--color-text);letter-spacing:-0.015em\"><span data-l=\"pt\">Desenvolvedor Web Sênior<\u002Fspan><span data-l=\"en\">Senior Web Developer<\u002Fspan><\u002Fh3>\n          <div style=\"font-size:13.5px;color:var(--color-accent);margin-bottom:12px\">Minesoft<\u002Fdiv>\n          <p data-l=\"pt\" style=\"margin:0 0 14px;font-size:14.5px;line-height:1.7;color:var(--pf-muted);max-width:64ch;text-wrap:pretty\">Integrei geração de imagem por prompt (LLM) em uma ferramenta de design visual embutida na plataforma e construí um CMS que deixa gente não-técnica publicar páginas. Também entreguei o back office em dólar com sistema de afiliados e revenda, pagamento em cripto e módulos financeiros; a loja de produtos; o módulo de eventos com venda de ingressos; e o front completo do back office de uma empresa de telefonia. Arquitetei múltiplos microfrontends em Angular 20–22 e um app mobile em React.<\u002Fp>\n          <p data-l=\"en\" style=\"margin:0 0 14px;font-size:14.5px;line-height:1.7;color:var(--pf-muted);max-width:64ch;text-wrap:pretty\">Integrated prompt-based AI image generation into a Canva-style design tool embedded in the platform, and built a WordPress-style CMS so non-technical users can publish pages. Also delivered a USD-denominated back office with affiliate and reseller sales, crypto payments and financial modules; an e-commerce storefront; an events module with ticket sales; and the complete front end for a telephony company's client back office. Architected multiple Angular 20–22 microfrontends and a React mobile app.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n            <span style=\"padding:5px 10px;border-radius:6px;background:var(--pf-chip);font:400 11.5px/1 var(--pf-mono);color:var(--pf-muted)\">Angular 20–22<\u002Fspan>\n            <span style=\"padding:5px 10px;border-radius:6px;background:var(--pf-chip);font:400 11.5px/1 var(--pf-mono);color:var(--pf-muted)\">Microfrontends<\u002Fspan>\n            <span style=\"padding:5px 10px;border-radius:6px;background:var(--pf-chip);font:400 11.5px/1 var(--pf-mono);color:var(--pf-muted)\">LLM<\u002Fspan>\n            <span style=\"padding:5px 10px;border-radius:6px;background:var(--pf-chip);font:400 11.5px/1 var(--pf-mono);color:var(--pf-muted)\">React<\u002Fspan>\n            <span style=\"padding:5px 10px;border-radius:6px;background:var(--pf-chip);font:400 11.5px/1 var(--pf-mono);color:var(--pf-muted)\">Crypto payments<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-reveal=\"\" style=\"display:grid;grid-template-columns:minmax(0,168px) minmax(0,1fr);gap:clamp(16px,3vw,44px);padding:26px 0;border-top:1px solid var(--pf-line)\" data-row=\"1\">\n        <div>\n          <div style=\"font:500 11.5px/1.5 var(--pf-mono);letter-spacing:.04em;color:var(--color-accent)\">2019 — <span data-l=\"pt\">hoje<\u002Fspan><span data-l=\"en\">now<\u002Fspan><\u002Fdiv>\n          <div style=\"margin-top:6px;font-size:11.5px;color:var(--pf-muted)\">Remote<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <h3 style=\"margin:0 0 3px;font:500 19px/1.3 var(--font-heading);color:var(--color-text);letter-spacing:-0.015em\"><span data-l=\"pt\">Fundador &amp; CTO<\u002Fspan><span data-l=\"en\">Founder &amp; CTO<\u002Fspan><\u002Fh3>\n          <div style=\"font-size:13.5px;color:var(--color-accent);margin-bottom:12px\">Pandev Tech<\u002Fdiv>\n          <p data-l=\"pt\" style=\"margin:0 0 14px;font-size:14.5px;line-height:1.7;color:var(--pf-muted);max-width:64ch;text-wrap:pretty\">Fundador, product owner e dev principal — ownership de ponta a ponta em todo projeto, da descoberta com o cliente à arquitetura, ao código, ao deploy e ao suporte. Entreguei 5+ aplicações grandes hoje em produção com React + Vite, apoiado em ferramentas de desenvolvimento com IA (Lovable, Claude Code), o que acelerou bastante os prazos sem comprometer o código. Lidero um time técnico e faço consultoria estratégica de TI para empresas de vários setores.<\u002Fp>\n          <p data-l=\"en\" style=\"margin:0 0 14px;font-size:14.5px;line-height:1.7;color:var(--pf-muted);max-width:64ch;text-wrap:pretty\">Founder, product owner and lead developer — full end-to-end ownership of every project, from client discovery and architecture to hands-on coding, deployment and ongoing support. Shipped 5+ large-scale applications currently live in production on a React + Vite stack with AI-assisted development tools (Lovable, Claude Code), significantly accelerating delivery without compromising code quality. I lead a technical team and provide strategic IT consulting across multiple industries.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n            <span style=\"padding:5px 10px;border-radius:6px;background:var(--pf-chip);font:400 11.5px/1 var(--pf-mono);color:var(--pf-muted)\">React + Vite<\u002Fspan>\n            <span style=\"padding:5px 10px;border-radius:6px;background:var(--pf-chip);font:400 11.5px/1 var(--pf-mono);color:var(--pf-muted)\">PHP<\u002Fspan>\n            <span style=\"padding:5px 10px;border-radius:6px;background:var(--pf-chip);font:400 11.5px/1 var(--pf-mono);color:var(--pf-muted)\">Python<\u002Fspan>\n            <span style=\"padding:5px 10px;border-radius:6px;background:var(--pf-chip);font:400 11.5px/1 var(--pf-mono);color:var(--pf-muted)\">Angular<\u002Fspan>\n            <span style=\"padding:5px 10px;border-radius:6px;background:var(--pf-chip);font:400 11.5px/1 var(--pf-mono);color:var(--pf-muted)\">Claude Code<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-reveal=\"\" style=\"display:grid;grid-template-columns:minmax(0,168px) minmax(0,1fr);gap:clamp(16px,3vw,44px);padding:26px 0;border-top:1px solid var(--pf-line)\" data-row=\"1\">\n        <div>\n          <div style=\"font:500 11.5px/1.5 var(--pf-mono);letter-spacing:.04em;color:var(--color-accent)\">2024 — 2025<\u002Fdiv>\n          <div style=\"margin-top:6px;font-size:11.5px;color:var(--pf-muted)\">Remote · Contractor<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <h3 style=\"margin:0 0 3px;font:500 19px/1.3 var(--font-heading);color:var(--color-text);letter-spacing:-0.015em\"><span data-l=\"pt\">Dev Fullstack Sênior (Ruby on Rails)<\u002Fspan><span data-l=\"en\">Senior Full Stack Developer (Ruby on Rails)<\u002Fspan><\u002Fh3>\n          <div style=\"font-size:13.5px;color:var(--color-accent);margin-bottom:12px\">SGI Sistemas / Solidus Smart<\u002Fdiv>\n          <p data-l=\"pt\" style=\"margin:0 0 14px;font-size:14.5px;line-height:1.7;color:var(--pf-muted);max-width:64ch;text-wrap:pretty\">Trabalhei no Solidus Smart, um ERP usado por varejistas de móveis e eletrodomésticos no Brasil inteiro. Novas features e refatoração de legado com foco em manutenibilidade, mais otimização de queries, estratégias de cache com Redis e arquitetura de microsserviços para aguentar a carga crescente.<\u002Fp>\n          <p data-l=\"en\" style=\"margin:0 0 14px;font-size:14.5px;line-height:1.7;color:var(--pf-muted);max-width:64ch;text-wrap:pretty\">Worked on Solidus Smart, an ERP used by furniture and appliance retailers across Brazil. Built new features and refactored legacy code for maintainability, and optimized database queries, Redis caching strategies and microservices architecture to handle growing load.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n            <span style=\"padding:5px 10px;border-radius:6px;background:var(--pf-chip);font:400 11.5px/1 var(--pf-mono);color:var(--pf-muted)\">Ruby on Rails<\u002Fspan>\n            <span style=\"padding:5px 10px;border-radius:6px;background:var(--pf-chip);font:400 11.5px/1 var(--pf-mono);color:var(--pf-muted)\">PostgreSQL<\u002Fspan>\n            <span style=\"padding:5px 10px;border-radius:6px;background:var(--pf-chip);font:400 11.5px/1 var(--pf-mono);color:var(--pf-muted)\">Sidekiq<\u002Fspan>\n            <span style=\"padding:5px 10px;border-radius:6px;background:var(--pf-chip);font:400 11.5px/1 var(--pf-mono);color:var(--pf-muted)\">Redis<\u002Fspan>\n            <span style=\"padding:5px 10px;border-radius:6px;background:var(--pf-chip);font:400 11.5px/1 var(--pf-mono);color:var(--pf-muted)\">AWS<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-reveal=\"\" style=\"display:grid;grid-template-columns:minmax(0,168px) minmax(0,1fr);gap:clamp(16px,3vw,44px);padding:26px 0;border-top:1px solid var(--pf-line)\" data-row=\"1\">\n        <div>\n          <div style=\"font:500 11.5px/1.5 var(--pf-mono);letter-spacing:.04em;color:var(--color-accent)\">2022 — 2025<\u002Fdiv>\n          <div style=\"margin-top:6px;font-size:11.5px;color:var(--pf-muted)\">Remote<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <h3 style=\"margin:0 0 3px;font:500 19px/1.3 var(--font-heading);color:var(--color-text);letter-spacing:-0.015em\"><span data-l=\"pt\">Dev de Sistemas Web Sênior III<\u002Fspan><span data-l=\"en\">Senior Web Systems Developer III<\u002Fspan><\u002Fh3>\n          <div style=\"font-size:13.5px;color:var(--color-accent);margin-bottom:12px\">Sitec Soluções Industriais<\u002Fdiv>\n          <p data-l=\"pt\" style=\"margin:0 0 14px;font-size:14.5px;line-height:1.7;color:var(--pf-muted);max-width:64ch;text-wrap:pretty\">Construí e mantive sistemas de automação industrial em PHP e Angular usados por uma das maiores processadoras de alimentos do mundo (JBS). Otimização de processos e ganho de eficiência operacional em sistemas críticos de produção — o tipo de código que não pode parar.<\u002Fp>\n          <p data-l=\"en\" style=\"margin:0 0 14px;font-size:14.5px;line-height:1.7;color:var(--pf-muted);max-width:64ch;text-wrap:pretty\">Built and maintained industrial automation systems in PHP and Angular used by one of the world's largest food processing companies (JBS). Optimized processes and improved operational efficiency of production-critical systems — the kind of code that cannot go down.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n            <span style=\"padding:5px 10px;border-radius:6px;background:var(--pf-chip);font:400 11.5px/1 var(--pf-mono);color:var(--pf-muted)\">Laravel<\u002Fspan>\n            <span style=\"padding:5px 10px;border-radius:6px;background:var(--pf-chip);font:400 11.5px/1 var(--pf-mono);color:var(--pf-muted)\">Angular<\u002Fspan>\n            <span style=\"padding:5px 10px;border-radius:6px;background:var(--pf-chip);font:400 11.5px/1 var(--pf-mono);color:var(--pf-muted)\">TypeScript<\u002Fspan>\n            <span style=\"padding:5px 10px;border-radius:6px;background:var(--pf-chip);font:400 11.5px/1 var(--pf-mono);color:var(--pf-muted)\">Docker<\u002Fspan>\n            <span style=\"padding:5px 10px;border-radius:6px;background:var(--pf-chip);font:400 11.5px/1 var(--pf-mono);color:var(--pf-muted)\">Ionic<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-reveal=\"\" style=\"display:grid;grid-template-columns:minmax(0,168px) minmax(0,1fr);gap:clamp(16px,3vw,44px);padding:26px 0;border-top:1px solid var(--pf-line)\" data-row=\"1\">\n        <div>\n          <div style=\"font:500 11.5px/1.5 var(--pf-mono);letter-spacing:.04em;color:var(--color-accent)\">2023 — 2024<\u002Fdiv>\n          <div style=\"margin-top:6px;font-size:11.5px;color:var(--pf-muted)\">Chapecó, SC<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <h3 style=\"margin:0 0 3px;font:500 19px/1.3 va
